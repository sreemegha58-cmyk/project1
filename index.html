<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">FurnitureHub</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Modern Furniture For Your Home</h1>
            <p>Discover stylish and comfortable furniture for every room.</p>
            <a href="#" class="btn">Shop Now</a>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products">
        <h2>Featured Furniture</h2>

        <div class="product-grid">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=500" alt="Sofa">
                <h3>Luxury Sofa</h3>
                <p>$499</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1519947486511-46149fa0a254?w=500" alt="Chair">
                <h3>Wooden Chair</h3>
                <p>$149</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=500" alt="Table">
                <h3>Dining Table</h3>
                <p>$299</p>
                <button>Buy Now</button>
            </div>

        </div>
    </section>

</body>
</html>
